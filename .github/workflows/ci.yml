---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Format, Indent, Static Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint yamllint

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Check YAML formatting and indentation
        run: yamllint .

      - name: Check shell formatting
        run: git ls-files -z '*.sh' | xargs -0 -r shfmt -d -i 2 -ci

      - name: Check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.18.1 README.md "docs/*.md"

      - name: Run Ansible static checks
        run: ansible-lint

      - name: Run Ansible syntax check
        run: ansible-playbook site.yml --syntax-check
